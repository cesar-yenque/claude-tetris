<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar tema claro/oscuro" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>

        <div id="highscore-entry" class="highscore-entry hidden">
          <input id="highscore-name-input" type="text" maxlength="12" placeholder="Tu nombre" />
          <button id="highscore-save-btn">Guardar</button>
        </div>

        <div class="highscore-section">
          <p class="label">RECORDS</p>
          <table id="highscore-table" class="highscore-table"></table>
          <p id="overlay-stats" class="stats-line"></p>
          <button id="reset-scores-btn" class="reset-btn">Resetear records</button>
          <div id="reset-confirm" class="reset-confirm hidden">
            <span>¿Borrar todos los records?</span>
            <button id="reset-confirm-yes">Sí</button>
            <button id="reset-confirm-no">No</button>
          </div>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>

        <div class="highscore-section">
          <p class="label">RECORDS</p>
          <table id="start-highscore-table" class="highscore-table"></table>
          <p id="start-stats" class="stats-line"></p>
        </div>

        <button id="start-btn">Jugar</button>
        <button id="start-reset-btn" class="reset-btn">Resetear records</button>
        <div id="start-reset-confirm" class="reset-confirm hidden">
          <span>¿Borrar todos los records?</span>
          <button id="start-reset-confirm-yes">Sí</button>
          <button id="start-reset-confirm-no">No</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
